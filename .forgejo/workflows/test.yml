name: Test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends trash-cli
      - run: python3 bin/qstack check
      - run: python3 -m unittest discover -s tests
